# pgvms cluster definition — the single source of truth.
# Sourced by bash (pglab, scripts/*) and parsed by the Vagrantfile.
# Keep to one KEY="value" per line, no inline comments.
# After changing anything here: ./pglab reset

CLUSTER_NAME="pgvms"
PG_MAJOR="16"
BOX="bento/almalinux-9"

# Nodes as name:ip pairs. The first PG node bootstraps the cluster.
# VirtualBox on macOS only allows host-only networks in 192.168.56.0/21
# unless you extend /etc/vbox/networks.conf.
CLUSTER_SUBNET="192.168.56.0/24"
PG_NODES="pgnode1:192.168.56.11 pgnode2:192.168.56.12 pgnode3:192.168.56.13 pgnode4:192.168.56.14 pgnode5:192.168.56.15 pgnode6:192.168.56.16"
ETCD_NODES="pgnode1 pgnode2 pgnode3"
HAPROXY_NODES="pghaproxy1:192.168.56.21 pghaproxy2:192.168.56.22"
VIP="192.168.56.20"

# VM sizing
PG_CPUS="2"
PG_MEMORY="2048"
LB_CPUS="1"
LB_MEMORY="512"

# Ports
PG_PORT="5432"
PATRONI_API_PORT="8008"
ETCD_CLIENT_PORT="2379"
ETCD_PEER_PORT="2380"
HAPROXY_RW_PORT="5000"
HAPROXY_RO_PORT="5001"
HAPROXY_STATS_PORT="8080"

# Credentials (lab only — do not reuse anywhere real)
POSTGRES_PASSWORD="postgres_pass"
REPLICATION_USER="replicator"
REPLICATION_PASSWORD="repl_pass"
REWIND_USER="rewind_user"
REWIND_PASSWORD="rewind_pass"
ADMIN_USER="admin"
ADMIN_PASSWORD="admin_pass"
HAPROXY_STATS_USER="admin"
HAPROXY_STATS_PASSWORD="admin"
KEEPALIVED_ROUTER_ID="51"
KEEPALIVED_PASSWORD="pgvmsvip"
